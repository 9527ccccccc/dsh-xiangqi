name: CI

on:
  push:
    branches: [master]
  pull_request:

# 只读就够：这个工作流不发布任何东西
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          # 作者在 Windows 上开发，这条用来保证「Windows 也能跑」不是口头承诺
          - os: windows-latest
            node: '24'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 没有依赖，所以没有 install 这一步。
      # 缺 @deepseek-ai/dsh-* 时测试会退回 test-support/ 里的替身，
      # 其中两条断言宿主 schema 编译器的用例会明着跳过。
      - name: 跑用例
        run: npm test
